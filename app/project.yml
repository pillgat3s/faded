name: Faded
options:
  bundleIdPrefix: com.andri
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Ad-hoc by default so a fresh clone builds with no setup. The Makefile
    # overrides this with $(CODESIGN_ID) — set a real identity there (see
    # local.mk in the README), because an ad-hoc signature changes on every
    # build and macOS then resets the app's microphone permission and its
    # login-item registration each time.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Faded:
    type: application
    platform: macOS
    sources:
      - path: Sources/Faded
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.faded
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Process taps, an event tap for the volume keys and the AppleScript
        # admin prompt all need an un-sandboxed app.
        ENABLE_APP_SANDBOX: NO
    info:
      path: Sources/Faded/Info.plist
      properties:
        CFBundleDisplayName: Faded
        CFBundleName: Faded
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSSupportsSuddenTermination: false
        NSAppleEventsUsageDescription: "Faded asks for an administrator password only to remove the audio driver an older version installed."
        # The input level meter has to open a capture stream — there is no
        # CoreAudio property that reports a microphone's level. Samples are
        # measured and dropped; nothing is recorded or stored.
        NSMicrophoneUsageDescription: "Faded needs microphone access only to draw the input level meter. Audio is measured and immediately discarded — nothing is recorded."
        # The menu lists paired headphones that are not audio-connected yet
        # (e.g. AirPods currently with the iPhone) and connects them on click,
        # like Control Center — that enumeration needs Bluetooth access.
        NSAudioCaptureUsageDescription: "Faded adjusts each app's volume by capturing its audio and playing it back at the level you set. Nothing is recorded or stored."
        NSBluetoothAlwaysUsageDescription: "Faded lists your paired headphones and connects them when you pick one — the same as choosing them in Control Center."
schemes:
  Faded:
    build:
      targets:
        Faded: all
    run:
      config: Debug
