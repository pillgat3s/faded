name: Faded
options:
  bundleIdPrefix: com.andri
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Ad-hoc by default so a fresh clone builds with no setup. The Makefile
    # overrides this with $(CODESIGN_ID) — set a real identity there (see
    # local.mk in the README), because an ad-hoc signature changes on every
    # build and macOS then resets the app's microphone permission and its
    # login-item registration each time.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Faded/Bridging/Faded-Bridging-Header.h
    # The shared-memory layout lives with the driver that defines it.
    HEADER_SEARCH_PATHS: $(SRCROOT)/../driver
targets:
  Faded:
    type: application
    platform: macOS
    sources:
      - path: Sources/Faded
      # The HAL driver bundle built by `make driver`; copied into
      # Faded.app/Contents/Resources so the app can install it.
      - path: ../driver/build/FadedDriver.driver
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.faded
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Custom properties on the driver + AppleScript admin prompt need no
        # sandbox; keep the app un-sandboxed (personal tool).
        ENABLE_APP_SANDBOX: NO
    info:
      path: Sources/Faded/Info.plist
      properties:
        CFBundleDisplayName: Faded
        CFBundleName: Faded
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSSupportsSuddenTermination: false
        NSAppleEventsUsageDescription: "Faded uses an administrator prompt to install its audio driver."
        # The input level meter has to open a capture stream — there is no
        # CoreAudio property that reports a microphone's level. Samples are
        # measured and dropped; nothing is recorded or stored.
        NSMicrophoneUsageDescription: "Faded needs microphone access only to draw the input level meter. Audio is measured and immediately discarded — nothing is recorded."
schemes:
  Faded:
    build:
      targets:
        Faded: all
    run:
      config: Debug
