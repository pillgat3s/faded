name: Faded
options:
  bundleIdPrefix: com.andri
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Same stable identity as SafeKey: an ad-hoc signature changes every build,
    # which resets TCC grants and (for us) the "Faded" login item registration.
    CODE_SIGN_IDENTITY: "Apple Development: thomannandri@gmail.com (R6QBGGCUGC)"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Faded:
    type: application
    platform: macOS
    sources:
      - path: Sources/Faded
      # The HAL driver bundle built by `make driver`; copied into
      # Faded.app/Contents/Resources so the app can install it.
      - path: ../driver/build/FadedDriver.driver
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andri.faded
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Custom properties on the driver + AppleScript admin prompt need no
        # sandbox; keep the app un-sandboxed (personal tool).
        ENABLE_APP_SANDBOX: NO
    info:
      path: Sources/Faded/Info.plist
      properties:
        CFBundleDisplayName: Faded
        CFBundleName: Faded
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSSupportsSuddenTermination: false
        NSAppleEventsUsageDescription: "Faded uses an administrator prompt to install its audio driver."
        # The input level meter has to open a capture stream — there is no
        # CoreAudio property that reports a microphone's level. Samples are
        # measured and dropped; nothing is recorded or stored.
        NSMicrophoneUsageDescription: "Faded needs microphone access only to draw the input level meter. Audio is measured and immediately discarded — nothing is recorded."
schemes:
  Faded:
    build:
      targets:
        Faded: all
    run:
      config: Debug
